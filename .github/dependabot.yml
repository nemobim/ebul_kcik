# 의존성 보안 패치 자동 추적
#
# react-router-dom 권고문처럼 "브라우저에 실리는 의존성"의 패치를 놓치지 않기 위한 설정.
# 사이드 프로젝트 규모를 고려해 월 1회로 제한하고, minor/patch는 묶어서 PR 수를 줄인다.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # CI에서 사용하는 GitHub Actions 버전도 함께 추적
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
