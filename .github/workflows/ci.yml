name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  build:
    name: lint · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
        env:
          # 빌드는 환경변수 없이도 통과해야 하므로 더미 값 주입 (실제 값은 배포 환경에서 설정)
          VITE_API_KEY: ci-dummy
          VITE_AUTH_DOMAIN: ci-dummy
          VITE_PROJECT_ID: ci-dummy
          VITE_STORAGE_BUCKET: ci-dummy
          VITE_MESSAGING_SENDER_ID: ci-dummy
          VITE_APP_ID: ci-dummy
          VITE_MEASUREMENT_ID: ci-dummy
      - run: pnpm test

  rules-test:
    name: firestore rules test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:rules
